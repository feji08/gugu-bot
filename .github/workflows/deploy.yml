name: Deploy

# 2026-09-06 改为仅手动触发：线上实例在 jingwen02 /home/bot/gugu-bot（systemd gugu-bot, User=bot），
# 4 月的 push→自动部署指向已作废的旧主机/root 路径。日常发布走 scp + systemctl restart，
# 需要时在 Actions 页手动 Run workflow（先确认 secrets SERVER_HOST/SERVER_USER/PRIVATE_KEY 已指向 jingwen02 的 bot 账户）。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /home/bot/gugu-bot
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            systemctl restart gugu-bot
